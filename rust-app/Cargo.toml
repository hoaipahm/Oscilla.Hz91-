[package]
name = "music-green"
version = "1.0.2"
edition = "2021"
description = "Music Green — Offline CRT music player (Rust native edition)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
lofty = "0.21"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
